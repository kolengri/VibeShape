name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'vibeshape-cloudflare-production' || format('vibeshape-cloudflare-production-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  preflight:
    if: github.repository == 'kolengri/VibeShape' && github.ref == 'refs/heads/main' && vars.VIBESHAPE_CLOUDFLARE_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.VIBESHAPE_CI_RUNNER == 'mac' && '["self-hosted","Linux","ARM64","vibeshape-mac"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check production prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_ASSET_ID: ${{ vars.VIBESHAPE_OCCT_RELEASE_ASSET_ID }}
        run: python3 ops/cloudflare/preflight.py

  verify:
    needs: preflight
    if: github.repository == 'kolengri/VibeShape' && github.ref == 'refs/heads/main' && vars.VIBESHAPE_CLOUDFLARE_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  warm-caches:
    needs: preflight
    # Keep default-branch receipts available to later PRs while deployment is blocked.
    if: always() && needs.preflight.result == 'failure' && github.repository == 'kolengri/VibeShape' && github.ref == 'refs/heads/main' && vars.VIBESHAPE_CLOUDFLARE_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ${{ fromJSON(vars.VIBESHAPE_CI_RUNNER == 'mac' && '["self-hosted","Linux","ARM64","vibeshape-mac"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    env:
      VITE_REMOTE_MCP_URL: ${{ vars.VIBESHAPE_REMOTE_MCP_URL }}
    outputs:
      site-cache-key: ${{ steps.site-transfer.outputs.cache-primary-key }}
      relay-cache-key: ${{ steps.relay-transfer.outputs.cache-primary-key }}
      manifest-sha256: ${{ steps.evidence.outputs.sha256 }}
      relay-manifest-sha256: ${{ steps.relay.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Check current main and configured kernel asset
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_ASSET_ID: ${{ vars.VIBESHAPE_OCCT_RELEASE_ASSET_ID }}
        run: |
          set -euo pipefail
          [[ "$KERNEL_ASSET_ID" =~ ^[0-9]+$ ]] || { echo 'Configure VIBESHAPE_OCCT_RELEASE_ASSET_ID.' >&2; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          mkdir -p .artifacts/cloudflare-kernel
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$KERNEL_ASSET_ID" -H 'Accept: application/octet-stream' > .artifacts/occt-source.tar
          echo '965e89b6b7afd1401e7ed34b0ac89157b78e5c3c76d897a2f503fc56523a70c0  .artifacts/occt-source.tar' | sha256sum --check --strict
          # BSD tar adds AppleDouble metadata; Linux treats it as extra payload files.
          # The unchanged manifest verifier still requires every source byte and exact inventory.
          tar --exclude='._*' -xf .artifacts/occt-source.tar -C .artifacts/cloudflare-kernel
      - name: Install locked dependencies
        run: bun ci
      - name: Build using the verified prebuilt kernel
        run: bun run prepare:local .artifacts/cloudflare-kernel
      - name: Package exact committed source
        run: bun scripts/local-distribution-build.ts "$GITHUB_WORKSPACE/.artifacts/cloudflare-package"
      - name: Exercise the production package
        env:
          VIBESHAPE_DISTRIBUTION_ROOT: ${{ github.workspace }}/.artifacts/cloudflare-package
        run: |
          bun node_modules/@playwright/test/cli.js install --with-deps chromium
          bun run test:distribution --project=chromium --workers=1
      - name: Prepare bounded static assets and complete sources
        run: bun scripts/prepare-cloudflare-site.ts .artifacts/cloudflare-package .artifacts/cloudflare-site
      - name: Bundle the configured relay without deployment credentials
        if: vars.VIBESHAPE_REMOTE_MCP_URL != ''
        id: relay
        run: |
          set -euo pipefail
          bun run --cwd apps/remote-mcp build
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil
          root = pathlib.Path('.artifacts/cloudflare-relay')
          root.mkdir()
          config = json.loads(re.sub(r'(?m)^\s*//[^\n]*$', '', pathlib.Path('apps/remote-mcp/wrangler.jsonc').read_text()))
          config['main'] = 'index.js'
          (root / 'wrangler.json').write_text(json.dumps(config) + '\n')
          shutil.copyfile('apps/remote-mcp/dist/index.js', root / 'index.js')
          files = [{'path': name, 'bytes': (root / name).stat().st_size,
                    'sha256': hashlib.sha256((root / name).read_bytes()).hexdigest()}
                   for name in ['index.js', 'wrangler.json']]
          manifest = root / 'relay-manifest.json'
          manifest.write_text(json.dumps({'sourceCommit': os.environ['GITHUB_SHA'], 'files': files}) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256=' + hashlib.sha256(manifest.read_bytes()).hexdigest() + '\n')
          PY
      - name: Stage the verified relay transfer
        if: vars.VIBESHAPE_REMOTE_MCP_URL != ''
        run: mv .artifacts/cloudflare-relay relay
      - name: Save the verified relay transfer
        if: vars.VIBESHAPE_REMOTE_MCP_URL != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: relay
          key: vibeshape-deploy-relay-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ steps.relay.outputs.sha256 }}
      - name: Check relay transfer availability
        if: vars.VIBESHAPE_REMOTE_MCP_URL != ''
        id: relay-transfer
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: relay
          key: vibeshape-deploy-relay-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ steps.relay.outputs.sha256 }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Require the exact relay transfer
        if: vars.VIBESHAPE_REMOTE_MCP_URL != ''
        run: test '${{ steps.relay-transfer.outputs.cache-hit }}' = true
      - name: Record exact transfer identity
        id: evidence
        run: |
          printf 'sha256=%s\n' "$(sha256sum .artifacts/cloudflare-site/site-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'Source: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the verified static site transfer
        run: mv .artifacts/cloudflare-site site
      - name: Save the verified static site transfer
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: site
          key: vibeshape-deploy-site-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ steps.evidence.outputs.sha256 }}
      - name: Check static site transfer availability
        id: site-transfer
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: site
          key: vibeshape-deploy-site-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ steps.evidence.outputs.sha256 }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Require the exact static site transfer
        run: test '${{ steps.site-transfer.outputs.cache-hit }}' = true

  publish-relay:
    needs: build
    if: needs.build.outputs.relay-manifest-sha256 != ''
    runs-on: ${{ fromJSON(vars.VIBESHAPE_CI_RUNNER == 'mac' && '["self-hosted","Linux","ARM64","vibeshape-mac"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    environment:
      name: cloudflare-mcp-production
      url: ${{ vars.VIBESHAPE_REMOTE_MCP_URL }}
    steps:
      - name: Restore this run's verified relay transfer
        id: transfer
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: relay
          key: ${{ needs.build.outputs.relay-cache-key }}
          fail-on-cache-miss: true
      - name: Require an exact transfer match
        run: test '${{ steps.transfer.outputs.cache-hit }}' = true
      - name: Validate exact relay artifact and current main head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST: ${{ needs.build.outputs.relay-manifest-sha256 }}
          MCP_URL: ${{ vars.VIBESHAPE_REMOTE_MCP_URL }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('relay')
          assert root.is_dir() and not root.is_symlink()
          assert {p.name for p in root.iterdir()} == {'index.js', 'wrangler.json', 'relay-manifest.json'}
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          manifest = root / 'relay-manifest.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == os.environ['EXPECTED_MANIFEST']
          data = json.loads(manifest.read_text())
          assert data['sourceCommit'] == os.environ['GITHUB_SHA']
          assert len(data['files']) == 2 and {f['path'] for f in data['files']} == {'index.js', 'wrangler.json'}
          for entry in data['files']:
              content = (root / entry['path']).read_bytes()
              assert len(content) == entry['bytes'] <= 5 * 1024 * 1024
              assert hashlib.sha256(content).hexdigest() == entry['sha256']
          config = json.loads((root / 'wrangler.json').read_text())
          assert config['name'] == 'vibeshape-remote-mcp'
          assert config['account_id'] == 'dddb9fcdf9bec709036b951ebb932642'
          assert config['main'] == 'index.js' and config['vars']['PUBLIC_ORIGIN'] + '/mcp' == os.environ['MCP_URL']
          PY
      - name: Deploy the reviewed relay before its editor
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_MCP_API_TOKEN }}
          accountId: dddb9fcdf9bec709036b951ebb932642
          wranglerVersion: 4.147.0
          command: deploy --cwd relay --config wrangler.json --no-bundle --tag main-${{ github.sha }}

  publish:
    needs: [build, publish-relay]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish-relay.result == 'success' || (needs.publish-relay.result == 'skipped' && needs.build.outputs.relay-manifest-sha256 == '')) }}
    runs-on: ${{ fromJSON(vars.VIBESHAPE_CI_RUNNER == 'mac' && '["self-hosted","Linux","ARM64","vibeshape-mac"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: cloudflare-production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Restore this run's verified site transfer
        id: transfer
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: site
          key: ${{ needs.build.outputs.site-cache-key }}
          fail-on-cache-miss: true
      - name: Require an exact transfer match
        run: test '${{ steps.transfer.outputs.cache-hit }}' = true
      - name: Validate artifact, destination and current main head
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST: ${{ needs.build.outputs.manifest-sha256 }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,57}$ ]] || { echo 'Configure CLOUDFLARE_PAGES_PROJECT.' >&2; exit 1; }
          [[ "$ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo 'Configure CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('site')
          assert root.is_dir() and not root.is_symlink()
          manifest = root / 'site-manifest.json'
          assert manifest.is_file() and not manifest.is_symlink()
          assert all(not path.is_symlink() for path in root.rglob('*'))
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == os.environ['EXPECTED_MANIFEST']
          data = json.loads(manifest.read_text())
          assert data['schemaVersion'] == 1 and data['sourceCommit'] == os.environ['GITHUB_SHA']
          expected = {entry['path']: entry for entry in data['files']}
          actual = {str(path.relative_to(root)) for path in root.rglob('*') if path.is_file() and path != manifest}
          assert len(expected) == len(data['files']) and actual == set(expected)
          assert len(actual) < 20000
          for name, entry in expected.items():
              path = root / name
              assert not path.is_symlink() and path.resolve().is_relative_to(root.resolve())
              content = path.read_bytes()
              assert len(content) == entry['bytes'] <= 25 * 1024 * 1024
              assert hashlib.sha256(content).hexdigest() == entry['sha256']
          PY
          printf 'project=%s\naccount=%s\n' "$PAGES_PROJECT" "$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
      - name: Deploy the verified static site
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.config.outputs.account }}
          wranglerVersion: 4.136.3
          command: pages deploy site --project-name=${{ steps.config.outputs.project }} --branch=main --commit-hash=${{ github.sha }}
      - name: Record deployment and rollback evidence
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SOURCE_SHA: ${{ github.sha }}
          SITE_SHA: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          printf 'Source: `%s`\nManifest SHA-256: `%s`\nDeployment: %s\n' "$SOURCE_SHA" "$SITE_SHA" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Rollback: select the previous successful production deployment in the Cloudflare Pages dashboard. Browser data is not rolled back.\n' >> "$GITHUB_STEP_SUMMARY"

  public-browser:
    needs: publish
    runs-on: ${{ fromJSON(vars.VIBESHAPE_CI_RUNNER == 'mac' && '["self-hosted","Linux","ARM64","vibeshape-mac"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - name: Install acceptance browsers
        run: bun node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Exercise the actual HTTPS deployment
        env:
          VIBESHAPE_PUBLIC_URL: ${{ needs.publish.outputs.deployment-url }}
          VIBESHAPE_EXPECTED_COMMIT: ${{ github.sha }}
        run: bun node_modules/@playwright/test/cli.js test --config=playwright.public.config.ts
      - name: Retain browser evidence in cache storage
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .artifacts/public-browser
          key: vibeshape-public-browser-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
