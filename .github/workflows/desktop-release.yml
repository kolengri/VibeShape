name: Desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibeshape-desktop-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'kolengri/VibeShape' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Draft releases require push access even for read-only API requests.
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check version, source and kernel availability
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_ASSET_ID: ${{ vars.VIBESHAPE_OCCT_RELEASE_ASSET_ID }}
        run: |
          set -euo pipefail
          python3 ops/cloudflare/preflight.py
          version="$(python3 -c 'import json; print(json.load(open("apps/desktop/package.json"))["version"])')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          tag="desktop-v$version"
          tag_commit="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)"
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo '::error::Version already tagged from another commit. Bump apps/desktop/package.json on main.'
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\")" > "$RUNNER_TEMP/existing-release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          text = (Path(os.environ["RUNNER_TEMP"]) / "existing-release.json").read_text().strip()
          if text:
              release = json.loads(text)
              if (release.get("draft") is not True
                      or release.get("target_commitish") != os.environ["GITHUB_SHA"]):
                  raise SystemExit("Version already released or belongs to another commit. Bump apps/desktop/package.json on main.")
          PY
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  website:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - name: Verify the website and desktop download discovery
        run: |
          bun run --cwd apps/site typecheck
          bun run build:site
          bunx --no-install playwright install --with-deps chromium
          bun run test:site

  build:
    needs: [preflight, verify, website]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      dmg-sha256: ${{ steps.assets.outputs.dmg-sha256 }}
      zip-sha256: ${{ steps.assets.outputs.zip-sha256 }}
      asset-digests: ${{ steps.assets.outputs.asset-digests }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Download the pinned corresponding-source kernel
        env:
          KERNEL_ASSET_ID: ${{ vars.VIBESHAPE_OCCT_RELEASE_ASSET_ID }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          [[ "$KERNEL_ASSET_ID" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p .artifacts/release-kernel
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$KERNEL_ASSET_ID" \
            -H 'Accept: application/octet-stream' > .artifacts/release-kernel.tar
          echo '965e89b6b7afd1401e7ed34b0ac89157b78e5c3c76d897a2f503fc56523a70c0  .artifacts/release-kernel.tar' | shasum -a 256 --check
          tar -xf .artifacts/release-kernel.tar -C .artifacts/release-kernel
      - run: bun ci
      - name: Build source-matched macOS and Windows packages
        run: |
          bun run desktop:package "$RUNNER_TEMP/release-macos" arm64 "$GITHUB_WORKSPACE/.artifacts/release-kernel"
          bun run desktop:package:windows "$RUNNER_TEMP/release-windows" x64 "$GITHUB_WORKSPACE/.artifacts/release-kernel"
      - name: Record the exact assets for acceptance and publication
        id: assets
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          version = os.environ["RELEASE_VERSION"]
          names = {
              "release-macos": [f"VibeShape-{version}-mac-arm64.dmg", "desktop-build.json", "SHA256SUMS"],
              "release-windows": [f"VibeShape-{version}-win-x64.zip", "desktop-build-win-x64.json", "SHA256SUMS-win-x64"],
          }
          digests = {}
          for directory, files in names.items():
              for name in files:
                  digest = hashlib.sha256()
                  with (root / directory / name).open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  digests[name] = "sha256:" + digest.hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"asset-digests={json.dumps(digests)}\n")
              output.write(f"dmg-sha256={digests[names['release-macos'][0]][7:]}\n")
              output.write(f"zip-sha256={digests[names['release-windows'][0]][7:]}\n")
          PY
      - name: Stage the draft release
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Source: $GITHUB_SHA

          macOS: Apple Silicon DMG, ad-hoc signed, not notarized or Developer ID authenticated.
          Windows: x64 portable ZIP, unsigned; no Authenticode signature.

          Each package includes exact application, OCCT and SolveSpace corresponding sources,
          dependency notices and replacement instructions. SHA256SUMS and SHA256SUMS-win-x64
          record the installer checksums; desktop-build receipts record source and runtime hashes.

          Downloads also appear at https://vibeshape.hello-world.cz after publication.
          EOF
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --title "VibeShape Desktop $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # A build-only rerun skips preflight, including after a successful publication.
          release_state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish --jq '[.isDraft, .targetCommitish] | @tsv')"
          if [[ "$release_state" != $'true\t'"$GITHUB_SHA" ]]; then
            echo '::error::Only a draft belonging to this source commit may receive release assets.'
            exit 1
          fi
          tag_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -n 1 | cut -f 1)"
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo '::error::Release tag belongs to another source commit; refuse asset replacement.'
            exit 1
          fi
          # A full rerun may rebuild this same draft; both acceptance jobs run again below.
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/release-macos/VibeShape-$RELEASE_VERSION-mac-arm64.dmg" \
            "$RUNNER_TEMP/release-macos/desktop-build.json" "$RUNNER_TEMP/release-macos/SHA256SUMS" \
            "$RUNNER_TEMP/release-windows/VibeShape-$RELEASE_VERSION-win-x64.zip" \
            "$RUNNER_TEMP/release-windows/desktop-build-win-x64.json" "$RUNNER_TEMP/release-windows/SHA256SUMS-win-x64"

  macos:
    needs: [preflight, build]
    permissions:
      contents: write
    uses: ./.github/workflows/macos-release-validation.yml
    with:
      release_tag: ${{ needs.preflight.outputs.tag }}
      source_commit: ${{ github.sha }}
      dmg_sha256: ${{ needs.build.outputs.dmg-sha256 }}

  windows:
    needs: [preflight, build]
    permissions:
      contents: write
    uses: ./.github/workflows/windows-release-validation.yml
    with:
      release_tag: ${{ needs.preflight.outputs.tag }}
      source_commit: ${{ github.sha }}
      zip_sha256: ${{ needs.build.outputs.zip-sha256 }}

  publish:
    needs: [preflight, build, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      EXPECTED_DIGESTS: ${{ needs.build.outputs.asset-digests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the draft still contains exactly the accepted assets
        run: |
          set -euo pipefail
          tag_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -n 1 | cut -f 1)"
          test -z "$tag_commit" || test "$tag_commit" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release.json").read_text())
          expected = json.loads(os.environ["EXPECTED_DIGESTS"])
          assets = release["assets"]
          if (release.get("draft") is not True or release.get("prerelease") is not False
                  or release.get("tag_name") != os.environ["RELEASE_TAG"]
                  or release.get("target_commitish") != os.environ["GITHUB_SHA"]
                  or len(assets) != len(expected)
                  or {asset["name"]: asset.get("digest") for asset in assets} != expected
                  or any(asset.get("state") != "uploaded" or asset.get("size", 0) <= 0 for asset in assets)):
              raise SystemExit("Draft source or assets changed after building; refuse publication.")
          PY
      - name: Publish the accepted release and expose website downloads
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          printf 'Release: https://github.com/%s/releases/tag/%s\n\nSource: `%s`\n\nWebsite downloads: https://vibeshape.hello-world.cz (discovered from GitHub Releases on page load).\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
