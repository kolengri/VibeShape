name: Presentation website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibeshape-presentation-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kolengri/VibeShape' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-production
      url: https://vibeshape.hello-world.cz
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install frozen dependencies
        run: bun ci

      - name: Check presentation source
        run: |
          bunx --no-install biome check apps/site tests/site playwright.site.config.ts
          bun run --cwd apps/site typecheck
          bun run typecheck:scripts

      - name: Build the presentation
        run: bun run build:site

      - name: Install Chromium
        run: bunx --no-install playwright install --with-deps chromium

      - name: Test the production build
        run: bun run test:site

      - name: Verify destination and current main
        env:
          GH_TOKEN: ${{ github.token }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$ACCOUNT_ID" = dddb9fcdf9bec709036b951ebb932642
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test -s apps/site/dist/index.html

      - name: Deploy presentation to its own Pages project
        id: deploy-first
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          command: pages deploy apps/site/dist --project-name=vibeshape-site --branch=main --commit-hash=${{ github.sha }}

      - name: Back off and require current main before retrying publication
        if: steps.deploy-first.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"

      - name: Retry presentation publication
        if: steps.deploy-first.outcome == 'failure'
        id: deploy-retry
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          command: pages deploy apps/site/dist --project-name=vibeshape-site --branch=main --commit-hash=${{ github.sha }}

      - name: Require successful publication
        id: deploy
        env:
          DEPLOYMENT_SUCCEEDED: ${{ steps.deploy-first.outcome == 'success' || steps.deploy-retry.outcome == 'success' }}
          DEPLOYMENT_URL: ${{ steps.deploy-first.outcome == 'success' && steps.deploy-first.outputs.deployment-url || steps.deploy-retry.outputs.deployment-url }}
        run: |
          test "$DEPLOYMENT_SUCCEEDED" = true
          test -n "$DEPLOYMENT_URL"
          printf 'deployment-url=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify the published HTML
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 4 "$DEPLOYMENT_URL" --output "$RUNNER_TEMP/presentation.html"
          cmp apps/site/dist/index.html "$RUNNER_TEMP/presentation.html"
          printf 'Presentation: https://vibeshape.hello-world.cz\nSource: `%s`\nDeployment: %s\n' "$GITHUB_SHA" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
