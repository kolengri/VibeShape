name: Controlled OCCT evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and test controlled OCCT
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Test controlled-build tooling
        run: bunx vitest run scripts/occt-build-artifacts.test.ts scripts/occt-build-config.test.ts scripts/occt-builder-context.test.ts scripts/build-occt-source-builder.test.ts

      - name: Build source-reproduced and patched OCCT artifact
        run: bun run occt:build:source

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run controlled OCCT memory evidence
        run: bun run occt:evidence:memory

      - name: Upload controlled-build evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: controlled-occt-evidence
          path: |
            .artifacts/occt-build/build-report.json
            .artifacts/occt-build/source-builder-baseline-report.json
            .artifacts/occt-build/builder-context/manifest.json
            .artifacts/occt-build/geometry-worker-evidence-*.json
            .artifacts/occt-build/input/vibeshape_occt.d.ts
            .artifacts/occt-build/input/vibeshape_occt.js
            .artifacts/occt-build/input/vibeshape_occt.wasm
            .artifacts/occt-build/input/vibeshape_occt.yml
            .artifacts/occt-build/sources/*.tar.gz
            .artifacts/playwright
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
