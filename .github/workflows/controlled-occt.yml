name: Controlled OCCT evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/controlled-occt.yml"
      - "apps/web/vite.config.ts"
      - "native/occt/**"
      - "package.json"
      - "playwright.config.ts"
      - "packages/geometry-worker/src/build-info.ts"
      - "packages/geometry-worker/src/memory-profile.ts"
      - "packages/geometry-worker/src/vite-modules.d.ts"
      - "scripts/occt-build-artifacts.test.ts"
      - "scripts/occt-build-artifacts.ts"
      - "scripts/occt-build-config.test.ts"
      - "scripts/occt-build-config.ts"
      - "scripts/prepare-occt-build.ts"
      - "tests/e2e/geometry-worker.spec.ts"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and test controlled OCCT
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Test controlled-build tooling
        run: bunx vitest run scripts/occt-build-artifacts.test.ts scripts/occt-build-config.test.ts

      - name: Build controlled OCCT artifact
        run: bun run occt:build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run allocator-instrumented geometry evidence
        env:
          VIBESHAPE_CONTROLLED_OCCT: "1"
          VIBESHAPE_GEOMETRY_LIFECYCLE_BATCHES: "5"
          VIBESHAPE_GEOMETRY_LIFECYCLE_ITERATIONS: "1000"
        run: bun run test:e2e -- --project=chromium tests/e2e/geometry-worker.spec.ts

      - name: Upload controlled-build evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: controlled-occt-evidence
          path: |
            .artifacts/occt-build/build-report.json
            .artifacts/occt-build/geometry-worker-evidence.json
            .artifacts/occt-build/input/vibeshape_occt.d.ts
            .artifacts/occt-build/input/vibeshape_occt.js
            .artifacts/occt-build/input/vibeshape_occt.wasm
            .artifacts/occt-build/input/vibeshape_occt.yml
            .artifacts/occt-build/sources/*.tar.gz
            .artifacts/playwright
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
