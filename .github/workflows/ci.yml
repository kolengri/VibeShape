name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to verify; empty uses the triggering event
        required: false
        type: string
        default: ''
      hybrid:
        description: Prefer complete isolated Mac CI for owner runs, with hosted fallback
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      hybrid:
        description: Prefer complete isolated Mac CI for owner runs, with hosted fallback
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  mac-ci:
    name: Isolated Mac CI
    if: ${{ (vars.VIBESHAPE_CI_HYBRID == 'true' || inputs.hybrid) && (startsWith(github.workflow_ref, 'kolengri/VibeShape/.github/workflows/ci.yml@') || startsWith(github.workflow_ref, 'kolengri/VibeShape/.github/workflows/cloudflare-pages.yml@')) && github.repository == 'kolengri/VibeShape' && github.actor == github.repository_owner && (github.triggering_actor == '' || github.triggering_actor == github.repository_owner) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      result: ${{ steps.mac.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Await isolated Mac CI ${{ inputs.source_ref || github.sha }}
        id: mac
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if python3 ops/isolated-ci/wait.py --scope ci --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "Complete CI passed in the isolated Mac worker." >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            if [[ "$code" != 75 ]]; then exit "$code"; fi
            echo "result=unavailable" >> "$GITHUB_OUTPUT"
            echo "Mac unavailable: running complete CI on GitHub." >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    needs: mac-ci
    if: ${{ !cancelled() && (needs.mac-ci.result == 'skipped' || (needs.mac-ci.result == 'success' && needs.mac-ci.outputs.result == 'unavailable')) }}
    name: Static and integration checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Test isolated Mac result policy
        run: python3 -m unittest discover -s ops/isolated-ci -p 'test_*.py'

      - name: Test production preflight policy
        run: python3 -m unittest discover -s ops/cloudflare -p 'test_*.py'

      - name: Test desktop release automation
        run: python3 -m unittest discover -s ops/desktop-release -p 'test_*.py'

      - name: Audit critical dependency vulnerabilities
        run: bun run audit

      - name: Validate agent skills
        run: bun run skills:validate

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Restore dependency-aware typecheck results
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-typecheck-v3-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', '**/tsconfig*.json', 'packages/typescript-config/*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-typecheck-v3-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', '**/tsconfig*.json', 'packages/typescript-config/*.json') }}-

      - name: Typecheck
        run: |
          start=$SECONDS
          bun run typecheck
          {
            echo "### Typecheck"
            echo "- Compiler: Bun $(bun --version) built-in checker"
            echo "- Duration: $((SECONDS - start))s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test remote MCP authorization and session boundaries
        run: bun run test:remote-mcp

      - name: Build browser application
        run: bun run build

      - name: Fallow audit
        run: bun run fallow:audit -- --no-cache

  unit-tests:
    needs: mac-ci
    if: ${{ !cancelled() && (needs.mac-ci.result == 'skipped' || (needs.mac-ci.result == 'success' && needs.mac-ci.outputs.result == 'unavailable')) }}
    name: Bun unit tests (${{ matrix.group }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The public repository never schedules a self-hosted runner.
      matrix:
        group: [node, dom]
        shard: ["1/3", "2/3", "3/3", ""]
        exclude:
          - { group: node, shard: "" }
          - { group: dom, shard: "1/3" }
          - { group: dom, shard: "2/3" }
          - { group: dom, shard: "3/3" }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Restore dependency-aware unit test results
        if: ${{ matrix.shard == '' }}
        id: unit-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/unit-tests/v1
          key: ${{ runner.os }}-${{ runner.arch }}-unit-tests-v2-${{ matrix.group }}-${{ hashFiles('bun.lock', 'package.json', 'scripts/run-unit-tests.ts', 'scripts/unit-test-*.ts', 'scripts/workspace-graph.ts', 'tests/unit/support/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-unit-tests-v2-${{ matrix.group }}-${{ hashFiles('bun.lock', 'package.json', 'scripts/run-unit-tests.ts', 'scripts/unit-test-*.ts', 'scripts/workspace-graph.ts', 'tests/unit/support/**') }}-

      - name: Test
        env:
          UNIT_TEST_GROUP: ${{ matrix.group }}
          UNIT_TEST_SHARD: ${{ matrix.shard }}
        # Native shards collectively own the complete corpus; only complete groups reuse receipts.
        run: |
          workers=$(bun -e 'console.log(require("node:os").availableParallelism())')
          args=(--group="$UNIT_TEST_GROUP" --parallel="$workers" --timeout=15000)
          if [[ -n "$UNIT_TEST_SHARD" ]]; then
            args+=(--shard="$UNIT_TEST_SHARD")
          else
            args+=(--cache)
          fi
          start=$SECONDS
          bun run test "${args[@]}"
          {
            echo "### Unit tests ($UNIT_TEST_GROUP)"
            echo "- Shard: ${UNIT_TEST_SHARD:-complete group}"
            echo "- Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
            echo "- Workers: $workers"
            echo "- Duration: $((SECONDS - start))s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save successful unit test receipts even when another scope fails
        if: ${{ !cancelled() && steps.unit-cache.outcome == 'success' && steps.unit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/unit-tests/v1
          key: ${{ steps.unit-cache.outputs.cache-primary-key }}

  verify:
    name: Fast PR checks
    if: always()
    needs: [mac-ci, checks, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job
        env:
          MAC_RESULT: ${{ needs.mac-ci.result }}
          MAC_OUTCOME: ${{ needs.mac-ci.outputs.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
        run: |
          if [[ "$MAC_RESULT" == success && "$MAC_OUTCOME" == success ]]; then
            test "$CHECKS_RESULT" = skipped || exit 1
            test "$UNIT_TESTS_RESULT" = skipped || exit 1
          else
            [[ "$MAC_RESULT" == skipped || ( "$MAC_RESULT" == success && "$MAC_OUTCOME" == unavailable ) ]] || exit 1
            test "$CHECKS_RESULT" = success || exit 1
            test "$UNIT_TESTS_RESULT" = success || exit 1
          fi
