name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Fast PR checks
    # Owner-authored, same-repository PRs may use the personal fallback runner.
    runs-on: ${{ fromJSON(vars.VIBESHAPE_CI_RUNNER == 'mac' && github.repository == 'kolengri/VibeShape' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)) && '["self-hosted","Linux","ARM64","vibeshape-mac"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Test local runner fallback policy
        run: python3 -m unittest discover -s ops/github-runner -p 'test_*.py'

      - name: Test production preflight policy
        run: python3 -m unittest discover -s ops/cloudflare -p 'test_*.py'

      - name: Audit critical dependency vulnerabilities
        run: bun run audit

      - name: Validate agent skills
        run: bun run skills:validate

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Restore dependency-aware typecheck results
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-typecheck-v1-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', '**/tsconfig*.json', 'packages/typescript-config/*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-typecheck-v1-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', '**/tsconfig*.json', 'packages/typescript-config/*.json') }}-

      - name: Restore incremental compiler state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            *.tsbuildinfo
            apps/*/*.tsbuildinfo
            packages/*/*.tsbuildinfo
          key: ${{ runner.os }}-${{ runner.arch }}-tsbuildinfo-v1-${{ hashFiles('bun.lock', 'package.json', '**/tsconfig*.json', 'packages/typescript-config/*.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-tsbuildinfo-v1-${{ hashFiles('bun.lock', 'package.json', '**/tsconfig*.json', 'packages/typescript-config/*.json') }}-

      - name: Typecheck
        run: |
          start=$SECONDS
          bun run typecheck
          {
            echo "### Typecheck"
            echo "- Compiler: $(bun run --bun tsc --version)"
            echo "- Duration: $((SECONDS - start))s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore dependency-aware unit test results
        id: unit-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/unit-tests/v1
          key: ${{ runner.os }}-${{ runner.arch }}-unit-tests-v1-${{ hashFiles('bun.lock', 'package.json', 'scripts/run-unit-tests.ts', 'scripts/unit-test-cache*.ts', 'scripts/workspace-graph.ts', 'tests/unit/support/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-unit-tests-v1-${{ hashFiles('bun.lock', 'package.json', 'scripts/run-unit-tests.ts', 'scripts/unit-test-cache*.ts', 'scripts/workspace-graph.ts', 'tests/unit/support/**') }}-

      - name: Test
        # Native receipts validate every input again after archive restoration.
        run: |
          workers=2
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            workers=$(bun -e 'console.log(require("node:os").availableParallelism())')
          fi
          bun run test --cache --parallel="$workers" --timeout=15000

      - name: Save successful unit test receipts even when another scope fails
        if: ${{ !cancelled() && steps.unit-cache.outcome == 'success' && steps.unit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/unit-tests/v1
          key: ${{ steps.unit-cache.outputs.cache-primary-key }}

      - name: Test remote MCP authorization and session boundaries
        run: bun run test:remote-mcp

      - name: Build browser application
        run: bun run build

      - name: Fallow audit
        run: bun run fallow:audit -- --no-cache
