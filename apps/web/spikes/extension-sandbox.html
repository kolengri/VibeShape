<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeShape extension sandbox spike</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #111113;
        color: #e4e4e7;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(44rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid #3f3f46;
        border-radius: 0.75rem;
        background: #18181b;
      }

      iframe {
        width: 100%;
        min-height: 5rem;
        margin-top: 1rem;
        border: 1px solid #52525b;
        background: white;
      }

      [data-state="passed"] {
        color: #86efac;
      }

      [data-state="failed"] {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Extension sandbox spike</h1>
      <p id="status" role="status" aria-live="polite" data-state="running">
        Running package and sandbox corpus…
      </p>
      <iframe id="extension-panel" title="Threaded Insert extension panel"></iframe>
    </main>
    <script type="module" src="../src/spikes/extension-sandbox.ts"></script>
  </body>
</html>
